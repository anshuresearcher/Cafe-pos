<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cafe POS — Support</title>
<style>
body{font-family:Inter,system-ui,Arial,sans-serif;background:#101827;margin:0;color:#182235}.shell{max-width:1180px;margin:32px auto;padding:0 18px}.login,.panel{background:#fff;border-radius:16px;box-shadow:0 12px 45px rgba(0,0,0,.2)}.login{width:min(430px,92vw);margin:10vh auto;padding:30px}.panel{padding:20px;margin-bottom:18px}.hidden{display:none}h1{margin:0 0 8px}.muted{color:#6d7482}label{display:block;font-weight:700;margin:14px 0 8px}input,select,button{padding:12px 13px;border-radius:10px;border:1px solid #d7dce5;font-size:14px;box-sizing:border-box}input,select{width:100%}button{background:#1f6feb;color:#fff;border:0;font-weight:700;cursor:pointer}.danger{background:#c93d3d}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:11px 8px;border-bottom:1px solid #edf0f4;text-align:left;font-size:13px;vertical-align:top}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eaf8ef;color:#176637;font-weight:700;font-size:11px}.badge.warn{background:#fff4db;color:#8b5b00}.badge.off{background:#ffe9e9;color:#9f2727}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.field{margin-bottom:12px}.field label{margin-top:0}.action-row{display:flex;gap:8px;flex-wrap:wrap}.keybox{margin-top:12px;padding:14px;background:#f2f6ff;border-radius:12px}.key{font-size:24px;letter-spacing:2px;font-weight:800}.err{margin-top:12px;padding:11px;border-radius:10px;background:#ffecec;color:#9f2727}.ok{margin-top:12px;padding:11px;border-radius:10px;background:#eaf8ef;color:#176637}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="shell">
<div id="login" class="login"><h1>Support Login</h1><div class="muted">Cafe POS support and license management.</div><form id="loginForm"><label>Username</label><input id="su" autocomplete="username" required><label>Password</label><input id="sp" type="password" autocomplete="current-password" required><button>Login</button></form><div id="loginMsg"></div></div>
<div id="app" class="hidden">
<div class="toolbar" style="color:#fff;margin-bottom:18px"><div><h1>Support Dashboard</h1><div id="supportUser"></div></div><button id="logout">Logout</button></div>
<div class="panel"><div class="toolbar"><h2>Businesses</h2><button onclick="loadBusinesses()">Refresh</button></div><table class="table"><thead><tr><th>Business</th><th>License</th><th>Devices</th><th>Users</th><th>Actions</th></tr></thead><tbody id="businessRows"></tbody></table></div>
<div class="panel"><h2>Issue / Renew License</h2><div class="grid"><div class="field"><label>Business ID</label><input id="lid"></div><div class="field"><label>Plan</label><input id="lplan" value="Professional"></div><div class="field"><label>Starts</label><input id="lstart" type="date"></div><div class="field"><label>Expires</label><input id="lexp" type="date"></div></div><div class="grid"><div class="field"><label>Max Devices</label><input id="lmax" type="number" min="1" value="2"></div><div class="field"><label>Status</label><select id="lstatus"><option value="active">Active</option><option value="suspended">Suspended</option><option value="revoked">Revoked</option><option value="expired">Expired</option></select></div><div class="field"><label>Notes</label><input id="lnotes"></div><div class="field" style="display:flex;align-items:end"><div class="action-row"><button id="issue">Issue / Renew</button><button id="update" style="background:#5b6472">Update Selected</button></div></div></div><div id="licenseMsg"></div></div>
<div class="panel"><h2>Selected Business Devices</h2><div id="selectedBusiness" class="muted">Select a business below.</div><table class="table"><thead><tr><th>Device</th><th>Status</th><th>Registered</th><th>Last Seen</th><th>Action</th></tr></thead><tbody id="deviceRows"></tbody></table></div>
<div class="panel"><h2>Generate Registration Key</h2><div class="grid"><div class="field"><label>Business ID</label><input id="kid"></div><div class="field"><label>Device Name</label><input id="kname" value="New POS Device"></div><div class="field"><label>Expiry Date/Time</label><input id="kexp" type="datetime-local"></div><div class="field" style="display:flex;align-items:end"><button id="generate">Generate</button></div></div><div id="keyMsg"></div></div>
</div></div>
<script>
async function api(url,options={}){const r=await fetch(url,{...options,credentials:'same-origin',headers:{'Content-Type':'application/json',...(options.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function msg(id,text,ok=false){const el=document.getElementById(id);el.className=ok?'ok':'err';el.textContent=text}
async function init(){try{const m=await api('/api/support/me');document.getElementById('supportUser').textContent='Signed in as '+m.user.displayName;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadBusinesses()}catch(_){} }
async function loadBusinesses(){try{const rows=await api('/api/support/businesses');document.getElementById('businessRows').innerHTML=rows.map(b=>{const badge=b.license_status==='active'?'badge':(b.license_status==='suspended'?'badge warn':'badge off');return `<tr><td><b>${esc(b.business_name)}</b><br><span class="muted">ID ${b.id} · ${esc(b.business_code)}</span></td><td><span class="${badge}">${esc(b.license_status||'none')}</span><br>${esc(b.plan||'—')}<br>Until ${b.expires_at?new Date(b.expires_at).toLocaleDateString():'—'}</td><td>${b.active_devices}/${b.max_devices||'—'}</td><td>${b.active_users}</td><td><div class="action-row"><button onclick="selectBiz(${b.id},${b.license_id||0})">Manage</button><button onclick="quickKey(${b.id})">Key</button></div></td></tr>`}).join('')||'<tr><td colspan="5">No businesses.</td></tr>'}catch(e){msg('licenseMsg',e.message)}}
async function selectBiz(id,licenseId){document.getElementById('lid').value=id;document.getElementById('kid').value=id;document.getElementById('lid').dataset.licenseId=licenseId||'';try{const rows=await api('/api/support/businesses');const b=rows.find(x=>x.id===id);if(b){document.getElementById('lplan').value=b.plan||'Professional';document.getElementById('lmax').value=b.max_devices||1;document.getElementById('lstatus').value=b.license_status||'active';document.getElementById('selectedBusiness').textContent=b.business_name; if(b.expires_at){document.getElementById('lexp').value=new Date(b.expires_at).toISOString().slice(0,10)} loadDevices(id)}}catch(e){msg('licenseMsg',e.message)}}
async function loadDevices(id){try{const d=await api('/api/support/businesses/'+id+'/devices');document.getElementById('deviceRows').innerHTML=d.map(x=>`<tr><td>${esc(x.device_name)}<br><span class="muted">${esc(x.device_type)}</span></td><td>${esc(x.status)}</td><td>${new Date(x.registered_at).toLocaleString()}</td><td>${new Date(x.last_seen_at).toLocaleString()}</td><td>${x.status==='active'?`<button class="danger" onclick="revoke(${x.id})">Revoke</button>`:'—'}</td></tr>`).join('')||'<tr><td colspan="5">No devices.</td></tr>'}catch(e){document.getElementById('deviceRows').innerHTML='<tr><td colspan="5">'+esc(e.message)+'</td></tr>'}}
async function revoke(id){if(!confirm('Revoke this device?'))return;try{await api('/api/support/devices/'+id+'/revoke',{method:'POST'});loadBusinesses();const bid=document.getElementById('kid').value;if(bid)loadDevices(bid)}catch(e){alert(e.message)}}
async function quickKey(id){document.getElementById('kid').value=id;document.getElementById('kname').focus();await generateKey()}
async function generateKey(){const id=document.getElementById('kid').value; if(!id)return alert('Enter business ID');try{const body={deviceName:document.getElementById('kname').value};const exp=document.getElementById('kexp').value;if(exp)body.expiresAt=new Date(exp).toISOString();const d=await api('/api/support/businesses/'+id+'/registration-keys',{method:'POST',body:JSON.stringify(body)});msg('keyMsg','Generated key: '+d.registrationKey.rawKey+' (expires '+new Date(d.registrationKey.expires_at).toLocaleString()+')',true)}catch(e){msg('keyMsg',e.message)}}
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{const d=await api('/api/support/login',{method:'POST',body:JSON.stringify({username:document.getElementById('su').value,password:document.getElementById('sp').value})});document.getElementById('supportUser').textContent='Signed in as '+d.user.displayName;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');loadBusinesses()}catch(err){msg('loginMsg',err.message)}});
document.getElementById('logout').onclick=async()=>{await api('/api/support/logout',{method:'POST'});location.reload()};
document.getElementById('issue').onclick=async()=>{try{const id=document.getElementById('lid').value;const start=document.getElementById('lstart').value;const exp=document.getElementById('lexp').value;if(!id||!start||!exp)throw new Error('Business ID, start date and expiry date are required');const d=await api('/api/support/businesses/'+id+'/licenses',{method:'POST',body:JSON.stringify({plan:document.getElementById('lplan').value,status:document.getElementById('lstatus').value,startsAt:start,expiresAt:exp,maxDevices:Number(document.getElementById('lmax').value),notes:document.getElementById('lnotes').value})});msg('licenseMsg','License saved. ID '+d.license.id,true);loadBusinesses();}catch(e){msg('licenseMsg',e.message)}};
document.getElementById('update').onclick=async()=>{try{const licenseId=document.getElementById('lid').dataset.licenseId;if(!licenseId)throw new Error('Select a business with an existing license first');const start=document.getElementById('lstart').value;const exp=document.getElementById('lexp').value;const d=await api('/api/support/licenses/'+licenseId,{method:'PATCH',body:JSON.stringify({plan:document.getElementById('lplan').value,status:document.getElementById('lstatus').value,startsAt:start,expiresAt:exp,maxDevices:Number(document.getElementById('lmax').value),notes:document.getElementById('lnotes').value})});msg('licenseMsg','License '+d.license.id+' updated.',true);loadBusinesses()}catch(e){msg('licenseMsg',e.message)}};
document.getElementById('generate').onclick=generateKey;
const today=new Date();document.getElementById('lstart').value=today.toISOString().slice(0,10);const exp=new Date(Date.now()+365*86400000);document.getElementById('lexp').value=exp.toISOString().slice(0,10);init();
</script>
</body></html>
